<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Light Sight Prototype</title>
    <link rel="stylesheet" href="./src/ui/styles.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Light Sight</h1>
          <p id="subtitle">Inert base rehearsal</p>
        </div>
        <div class="timeControls" aria-label="Simulation time controls">
          <button id="playPause" type="button">Play</button>
          <button id="nextEvent" type="button">Next event</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </header>

      <main class="workspace">
        <section class="mapShell" aria-label="Observed frontier map">
          <div class="mapStage">
            <canvas id="map" width="900" height="560"></canvas>
            <div id="starHitLayer" class="starHitLayer" aria-label="Selectable stars"></div>
          </div>
          <div class="legend" aria-label="Map legend">
            <span><i class="legendDot catalog"></i>Unknown</span>
            <span><i class="legendDot scouted"></i>Scouted</span>
            <span><i class="legendDot owned"></i>Owned</span>
            <span><i class="legendLine policy"></i>Policy signal</span>
            <span><i class="legendLine scout"></i>Scout</span>
            <span><i class="legendLine missile"></i>Missile</span>
            <span><i class="legendLine colony"></i>Expansion</span>
          </div>
        </section>

        <aside class="sidePanel">
          <section class="panel selectedPanel">
            <div class="sectionHeader">
              <h2 id="selectedName">Sol</h2>
              <span id="selectedState">Owned</span>
            </div>
            <dl id="selectedFacts"></dl>
            <div class="policyControls" aria-label="Policy controls">
              <button data-policy="Expand" type="button">Expand</button>
              <button data-policy="Attack" type="button">Attack</button>
              <button data-policy="Scout" type="button">Scout</button>
            </div>
            <p id="pendingPolicy" class="pendingLine"></p>
          </section>

          <section class="panel">
            <div class="sectionHeader">
              <h2>Known stars</h2>
              <span id="knowledgeClock">t=0.0</span>
            </div>
            <div id="knowledgeList" class="knowledgeList"></div>
          </section>

          <section class="panel logPanel">
            <div class="sectionHeader">
              <h2>Event Log</h2>
              <span>home view</span>
            </div>
            <ol id="eventLog" class="eventLog"></ol>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="./dist/ui/app.js?v=r2-telemetry"></script>
  </body>
</html>
